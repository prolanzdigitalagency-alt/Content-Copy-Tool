async function callClaude(messages, model, mcpServers, maxTokens) {
  const body = { model, max_tokens: maxTokens || 1000, messages, tool: "copywriter" };
  if (mcpServers) body.mcp_servers = mcpServers;
  const token = (window.__SB_SESSION__ && window.__SB_SESSION__.access_token) || "";
  const res = await fetch("/api/generate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token,
    },
    body: JSON.stringify(body),
  });
  let data = null;
  try {
    data = await res.json();
  } catch (e) {
    /* non-JSON */
  }
  if (!res.ok) {
    const msg = (data && data.error) || "HTTP " + res.status;
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n")
    .trim();
}
async function withRetry(fn, tries = 2) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      return await fn();
    } catch (e) {
      last = e;
    }
  }
  throw last;
}

function parseObj(raw) {
  let t = raw.replace(/```json/gi, "").replace(/```/g, "").trim();
  const s = t.indexOf("{"),
    e = t.lastIndexOf("}");
  if (s !== -1 && e !== -1) t = t.slice(s, e + 1);
  return JSON.parse(t);
}

// Repairs a truncated JSON string by closing any open string/brackets.
function repairJson(t) {
  const stack = [];
  let inStr = false,
    esc = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inStr) {
      if (esc) esc = false;
      else if (c === "\\") esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === "{") stack.push("}");
    else if (c === "[") stack.push("]");
    else if (c === "}" || c === "]") stack.pop();
  }
  let out = t;
  if (inStr) out += '"';
  out = out.replace(/,\s*$/, "");
  while (stack.length) out += stack.pop();
  return out;
}

// Tolerant parse: tries clean JSON, then a repaired version.
function parseObjSafe(raw) {
  let t = raw.replace(/```json/gi, "").replace(/```/g, "").trim();
  const s = t.indexOf("{");
  if (s === -1) throw new Error("No JSON in response.");
  t = t.slice(s);
  const e = t.lastIndexOf("}");
  const candidate = e !== -1 ? t.slice(0, e + 1) : t;
  try {
    return JSON.parse(candidate);
  } catch (_) {}
  try {
    return JSON.parse(repairJson(t));
  } catch (_) {
    throw new Error("The optimizer returned an incomplete result — tap Optimize again.");
  }
}

function fallbackCopy(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (_) {
    return false;
  }
}

function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      return true;
    }
  } catch (_) {}
  return fallbackCopy(text);
}

function copyToText(item) {
  const lines = [];
  if (item.label) lines.push(`[${item.label}]`);
  (item.blocks || []).forEach((b) => {
    lines.push("");
    lines.push(b.label);
    if (Array.isArray(b.items)) b.items.forEach((it) => lines.push(`  • ${it}`));
    else if (b.text) lines.push(b.text);
  });
  return lines.join("\n").trim();
}


// Starts an ad search on our backend (Apify runs it in the background) and
// checks back every few seconds until the results are ready. Never waits
// inside the backend's 10-second window.
async function runAdSearch({ platform, q, country, limit }, onStatus) {
  const token = (window.__SB_SESSION__ && window.__SB_SESSION__.access_token) || "";
  const headers = { "Content-Type": "application/json", Authorization: "Bearer " + token };
  const startRes = await fetch("/api/ads", {
    method: "POST",
    headers,
    body: JSON.stringify({ platform, q, country, limit }),
  });
  let startData = null;
  try { startData = await startRes.json(); } catch (e) {}
  if (!startRes.ok) throw new Error((startData && startData.error) || "HTTP " + startRes.status);
  const { runId, datasetId } = startData;
  const started = Date.now();
  const deadline = started + 120000; // up to 2 minutes
  let first = true;
  while (Date.now() < deadline) {
    await new Promise((r) => setTimeout(r, first ? 4000 : 3000));
    first = false;
    if (onStatus) onStatus(`Searching the ad library… ${Math.round((Date.now() - started) / 1000)}s`);
    const sRes = await fetch(
      `/api/ads-status?runId=${encodeURIComponent(runId)}&datasetId=${encodeURIComponent(datasetId)}`,
      { headers: { Authorization: "Bearer " + token } }
    );
    let sData = null;
    try { sData = await sRes.json(); } catch (e) {}
    if (!sRes.ok) throw new Error((sData && sData.error) || "HTTP " + sRes.status);
    if (sData.status === "done") return sData.items || [];
    if (sData.status === "failed") throw new Error(sData.error || "The ad search didn't complete.");
  }
  throw new Error("The ad search took too long. Try again or use a narrower keyword.");
}

// Trims raw ad records so they fit comfortably in one Claude call.
function compactAds(items, max = 25, charCap = 12000) {
  let s = JSON.stringify((items || []).slice(0, max));
  if (s.length > charCap) s = s.slice(0, charCap) + "…]";
  return s;
}


// Turns the model's markdown-ish output into clean React nodes:
// **bold** and *bold* become real bold, stray asterisks are removed.
function renderRich(text) {
  if (text == null) return null;
  const str = String(text);
  const parts = str.split(/(\*\*[^*]+\*\*|\*[^*\n]+\*)/g);
  return parts.map((p, i) => {
    if (/^\*\*[^*]+\*\*$/.test(p)) return React.createElement("strong", { key: i }, p.slice(2, -2));
    if (/^\*[^*\n]+\*$/.test(p)) return React.createElement("strong", { key: i }, p.slice(1, -1));
    return p.replace(/\*+/g, "");
  });
}


// Notify-when-done: asks permission the first time, then pings on completion
// (only fires if the tab isn't focused, so it doesn't nag during active use).
function notifyDone(title, body) {
  try {
    if (!("Notification" in window)) return;
    if (Notification.permission === "granted") {
      if (document.hidden) new Notification(title, { body });
    } else if (Notification.permission !== "denied") {
      Notification.requestPermission();
    }
  } catch (e) {}
}

      type === "vsl"
        ? `\nVSL RULES:
- STRUCTURE COMES FROM THE WINNER: mirror the structure, beat order, hook style and pacing of the winning brand(s) being modeled above — do NOT force a fixed template onto it. If NO winner is being modeled, use the proven default order: Hook → Offer Teaser → Anchor → Problem → Agitation → Solution → Proof → Offer → CTA.
- GUARDRAILS (always apply, whatever the structure): lock ONE audience (the single highest-value buyer); the hook must stop the scroll; prices/discounts in NAIRA, never percentages; ONE offer only; exactly ONE CTA (never two); if the store info gives a guarantee, make it concrete (refund / replace) and use it as proof; any address is a trust signal woven in early, never beside the CTA; use pay-on-delivery / Nigerian trust signals where relevant; no filler or throat-clearing; hard cap ~50 seconds (~130-150 words) — cut, don't rush.
- Give 3 distinct hook options.
- In PRODUCTION NOTES, name the recommended CREATIVE TYPE to shoot (Founder's Story / Talking Head / Testimonial / Product Demo / Street Interview / Us vs Them / UGC-Skit), based on how the modeled winners deliver.\n`
        : "";

    const landingSpec =
      type === "landing"
        ? bizType === "service"
          ? `\nLANDING SPEC — SERVICE-based (text-heavy, fuller copy). Blocks in THIS order:\n{HERO: headline + subhead + CTA}\n{ABOUT US: who we are + credibility}\n{OUR SERVICES: items — each service, one line}\n{WHY US: items — 3-5 reasons/benefits}\n{PROOF: results, or a testimonial TEMPLATE with a [Client] placeholder — never invent reviews}\n{OFFER: the offer / free consultation, price in naira if any}\n{LEAD FORM: items — "Full name","Phone (WhatsApp)","Email","Service needed","Preferred time / message","Button label e.g. 'Book a call'"}\n{FAQ: items — 3-4 "Q — A"}\n{FINAL CTA: one line}\n`
          : `\nLANDING SPEC — PRODUCT-based (visual-heavy, keep section copy punchy). Blocks in THIS order:\n{HERO: headline + subhead + CTA}\n{PRODUCT: items — what it is + 3-5 benefit/feature lines}\n{OFFER: the offer + price in naira}\n{ORDER FORM: items — "Full name","Phone (WhatsApp)","Delivery address","Quantity","Pay on delivery where relevant","Button label e.g. 'Order now'"}\n{REVIEWS: items — 2-3 short testimonial TEMPLATES with [Customer name] placeholders — never invent reviews}\n{FAQ: items — 3-4 "Q — A"}\n{FINAL CTA: one line}\n`
        : "";

    const promptText = `${BRAND}

${PLAYBOOK}
${winnersBlock}${vslRules}${landingSpec}
Business type: ${
      bizType === "service"
        ? "SERVICE-based — sell trust and expertise; the goal is an enquiry, booking or call, not an instant purchase."
        : "PRODUCT-based — the goal is to drive the order/purchase directly."
    } Shape the angle, proof and CTA accordingly.
${
      refImage
        ? "A reference image is attached (e.g. product photo, competitor ad, testimonial screenshot). Look at it and use whatever is relevant — product look, on-screen claims, layout, proof — to ground the copy.\n"
        : ""
    }WRITE ONE piece of copy, modeled on the winning structures above.
- Copy type: ${type} (${TYPE_LABEL[type]})
- Niche: ${niche.trim() || brand.trim() || "(infer from product)"}
- Brand / product & what's sold: ${brand.trim() || "(infer sensibly)"}
- Offer: ${offer.trim() || "(none given)"}
- Price: ${price.trim() || "(not specified)"}
- Target audience: ${audience.trim() || audienceAngle || "(general)"}
- Store / other info (address, guarantee, pay-on-delivery, hours, anything to use): ${notes.trim() || "(none)"}
- Additional details${refImage ? " about the attached screenshot" : ""}: ${additionalDetails.trim() || "(none)"}
- Tone: ${tone}${avoid}

Return STRICT JSON ONLY — no markdown, no text outside the braces:
{
  "label": "3-5 word angle name",
  "type": "${type}",
  "blocks": [ { "label": "UPPERCASE LABEL", "text": "..." } OR { "label": "UPPERCASE LABEL", "items": ["..."] } ]
}
Use the block shape from the playbook for this copy type. Use exactly ONE CTA in the whole piece — never two.`;

    const messageContent = refImage
      ? [
          {
            type: "image",
            source: {
              type: "base64",
              media_type: refImage.mediaType,
              data: refImage.data,
            },
          },
          { type: "text", text: promptText },
        ]
      : promptText;

    return withRetry(async () => {
      const raw = await smartCall(
        [{ role: "user", content: messageContent }],
        undefined,
        2000
      );
      if (myRun !== runId.current) return null;
      return parseObjSafe(raw);
    });
  }

  async function handleGenerate() {
    const myRun = ++runId.current;
    setLoading(true);
    setError("");
    setItems([]);
    setGroundNote("");
    setCopiedAll(false);
    try {
      const refText = buildReference();
      if (!refText)
        setGroundNote(
          "No winners analysed yet — run “Analyse this niche” first for grounded copy. This draft is best-effort."
        );
      let total = 0;
      let lastReason = "";
      for (const type of copyTypes) {
        const labels = [];
        for (let i = 0; i < count; i++) {
          if (myRun !== runId.current) return;
          setStatus(
            `Writing ${TYPE_LABEL[type] || type} ${i + 1} of ${count}…`
          );
          try {
            const item = await generateOne(type, refText, labels, myRun);
            if (!item) return;
            labels.push(item.label || `#${i + 1}`);
            setItems((prev) => [...prev, item]);
            total++;
          } catch (e) {
            lastReason = (e && e.message) || String(e);
          }
        }
      }
      if (myRun !== runId.current) return;
      if (total === 0)
        setError(
          "Couldn't write anything that time. " +
            (lastReason ? "Reason: " + lastReason + ". " : "") +
            "Hit generate again."
        );
    } catch (e) {
      setError("Something broke: " + ((e && e.message) || String(e)));
    } finally {
      if (myRun === runId.current) {
        setLoading(false);
        setStatus("");
        notifyDone("Your copy is ready", "Prolanz Copywriter");
      }
    }
  }

  async function optimizeItem(index) {
    if (optimizingIndex !== null) return;
    const item = items[index];
    if (!item) return;
    setOptimizingIndex(index);
    setError("");
    try {
      const current = copyToText(item);
      const opt = await withRetry(async () => {
        const raw = await smartCall([
          {
            role: "user",
            content: `${BRAND}

${OPTIMIZE_GUIDE}

CONTEXT:
- Copy type: ${item.type}
- Offer: ${offer.trim() || "(none given)"} | Price: ${price.trim() || "(n/a)"}
- Audience / TAM: ${audience.trim() || audienceAngle || "(lock the single highest-value buyer)"}
- Store / other info: ${notes.trim() || "(none)"}

COPY TO OPTIMIZE:
${current}

Optimize this copy so it fully complies with the rules above. Keep the WHOLE JSON compact so it fits: OFFER ASSESSMENT ≤ 2 sentences, the script tight (≤150 words total), FLAGS one line. Return STRICT JSON ONLY — no markdown, no text outside the braces:
{
  "label": "Optimized (v5.6)",
  "type": "${item.type}",
  "blocks": [
    { "label": "OFFER ASSESSMENT", "text": "strong | moderate | weak — why, in plain language; flag weak elements + concrete fixes" },
    ...the optimized copy blocks in the correct structure for this copy type...,
    { "label": "FLAGS", "text": "anything needing confirmation (guarantee, dates, unverified claims, missing info) or 'none'" }
  ]
}`,
          },
        ], undefined, 2000);
        return parseObjSafe(raw);
      });
      setItems((prev) => prev.map((it, i) => (i === index ? opt : it)));
    } catch (e) {
      setError("Optimize failed: " + ((e && e.message) || String(e)));
    } finally {
      setOptimizingIndex(null);
    }
  }

  function copyOne(item) {
    copyText(copyToText(item));
  }

  async function generateDirective() {
    if (!directScript.trim() || directLoading) return;
    setDirectLoading(true);
    setDirectError("");
    setDirective(null);
    setDirectStatus("Directing it like the winners…");
    try {
      const winCreatives = brandOptions
        .filter((b) => b.creative)
        .map((b) => `${b.brand}: ${b.creative}`)
        .join("; ");
      const nicheTxt = directNiche.trim() || niche.trim() || "(general)";
      const item = await withRetry(async () => {
        const raw = await smartCall(
          [
            {
              role: "user",
              content: `${BRAND}

You are also the CREATIVE DIRECTOR. Turn the script below into a shoot-ready CREATIVE DIRECTIVE — exactly how to produce it — modeled on how WINNING BRANDS in this niche execute their creative.
Niche: ${nicheTxt}
${
  winCreatives
    ? `Winning brands here mostly deliver as: ${winCreatives}. Lean toward the dominant winning creative type.`
    : "(No pulled winners on hand — base it on strong direct-response video craft for this niche.)"
}

SCRIPT:
${directScript.trim()}

Return STRICT JSON ONLY — no markdown, no text outside the braces:
{
  "label": "Creative directive",
  "type": "directive",
  "blocks": [
    {"label":"CREATIVE TYPE","text":"which of Founder's Story / Talking Head / Testimonial / Product Demo / Street Interview / Us vs Them / UGC-Skit to shoot, and why (tie it to the winners)"},
    {"label":"SHOT LIST","items":["beat-by-beat: for each part of the script — what's on screen, camera move, talent action, setting"]},
    {"label":"VISUAL STYLE","text":"look & feel, on-screen text style, energy"},
    {"label":"PACING & RETENTION","text":"cut cadence, first-2s visual hook, open loops, b-roll notes"},
    {"label":"TALENT & SETTING","text":"who's on camera, wardrobe/props, location"},
    {"label":"SOUND","text":"VO / trending sound / music direction"},
    {"label":"DELIVERY","text":"aspect ratio, captions, platform"}
  ]
}`,
            },
          ],
          undefined,
          2000
        );
        return parseObjSafe(raw);
      });
      setDirective(item);
    } catch (e) {
      setDirectError(
        "Couldn't generate directions: " + ((e && e.message) || String(e))
      );
    } finally {
      setDirectLoading(false);
      setDirectStatus("");
    }
  }

  function copyAll() {
    const all = items
      .map((it, i) => `#${i + 1} — ${it.label || ""}\n${copyToText(it)}`)
      .join("\n\n" + "-".repeat(40) + "\n\n");
    copyText(all);
    setCopiedAll(true);
    setTimeout(() => setCopiedAll(false), 1600);
  }

  const analysed = brandOptions.length > 0 || offerOptions.length > 0;

  return (
    <div className="pz-root">
      <style>{CSS}</style>
      <TopBar />

      <header className="pz-head">
        <div className="pz-eyebrow">PROLANZ&nbsp;DIGITALS&nbsp;·&nbsp;COPYWRITER</div>
        <h1 className="pz-title">Copywriter</h1>
        <p className="pz-sub">
          One niche scan pulls the winning brands, offers, prices and audience running <em>right now</em> — then writes copy modeled on it.
        </p>
      </header>

      <div className="pz-modebar">
        <button
          className={"pz-modebtn" + (tab === "write" ? " on" : "")}
          onClick={() => setTab("write")}
        >
          Write copy
        </button>
        <button
          className={"pz-modebtn" + (tab === "direct" ? " on" : "")}
          onClick={() => setTab("direct")}
        >
          Creative Direction
        </button>
      </div>

      {tab === "write" && (
      <>
      <section className="pz-panel">
        <div className="pz-field">
          <label className="pz-label">
            What copy do you need <span className="pz-opt">(pick one or more)</span>
          </label>
          <div className="pz-chips">
            {COPY_TYPES.map((t) => (
              <button
                key={t.id}
                className={"pz-chip" + (copyTypes.includes(t.id) ? " on" : "")}
                onClick={() => toggleCopyType(t.id)}
                disabled={loading}
              >
                {t.label}
              </button>
            ))}
          </div>
        </div>

        <div className="pz-field">
          <label className="pz-label">
            Business type{" "}
            <span className="pz-opt">(shapes the copy + landing sections)</span>
          </label>
          <div className="pz-chips">
            {[
              { id: "product", label: "Product-based" },
              { id: "service", label: "Service-based" },
            ].map((o) => (
              <button
                key={o.id}
                className={"pz-chip" + (bizType === o.id ? " on" : "")}

                {o.label}
              </button>
            ))}
          </div>
        </div>

        <div className="pz-two">
          <div className="pz-field">
            <label className="pz-label">Niche / industry</label>
            <input
              className="pz-input"
              value={niche}
              onChange={(e) => setNiche(e.target.value)}
              placeholder="e.g. human-hair wigs, meal prep, gym"
              disabled={loading}
            />
          </div>
          <div className="pz-field pz-country">
            <label className="pz-label">
              Country <span className="pz-opt">(ad market)</span>
            </label>
            <input
              className="pz-input"
              value={country}
              onChange={(e) => setCountry(e.target.value)}
              placeholder="NG"
              disabled={loading}
            />
          </div>
        </div>

        <div className="pz-field">
          <label className="pz-label">Analyse what's winning</label>
          <button
            className="pz-find"
            onClick={analyzeNiche}
            disabled={analyzing || loading || !niche.trim()}
          >
            {analyzing
              ? analyzeStatus || "Analysing…"
              : "🔎 Analyse this niche (brands · offers · prices)"}
          </button>
          {analyzeError && <div className="pz-hint">{analyzeError}</div>}
        </div>

        {analysed && (
          <div className="pz-analysis">
            {brandOptions.length > 0 && (
              <>
                <div className="pz-analysis-tag">WINNING BRANDS — tap to model</div>
                <div className="pz-chips">
                  {brandOptions.map((b, i) => (
                    <button
                      key={i}
                      className={
                        "pz-chip alt" +
                        (pickedBrands.includes(b.brand) ? " on2" : "")
                      }
                      onClick={() => togglePicked(b.brand)}
                      disabled={loading}
                      title={b.note || ""}
                    >
                      {b.brand}
                    </button>
                  ))}
                </div>
                {brandOptions.some((b) => b.creative) && (
                  <div className="pz-deliver">
                    <div className="pz-analysis-tag" style={{ marginTop: 14 }}>
                      HOW THEY DELIVER — the creative type to shoot
                    </div>
                    {brandOptions
                      .filter((b) => b.creative)
                      .map((b, i) => (
                        <div className="pz-deliver-row" key={i}>
                          <span>{b.brand}</span>
                          <span className="pz-deliver-type">{b.creative}</span>
                        </div>
                      ))}
                  </div>
                )}
              </>
            )}

            {offerOptions.length > 0 && (
              <>
                <div className="pz-analysis-tag" style={{ marginTop: 16 }}>
                  WINNING OFFERS — tap to use
                </div>
                <div className="pz-chips">
                  {offerOptions.map((o, i) => (
                    <button
                      key={i}
                      className={"pz-chip" + (offer === o ? " on" : "")}

                      disabled={loading}

            {(pricePoints || audienceAngle) && (
              <div className="pz-readout">

                  </div>

        <div className="pz-field">
          <label className="pz-label">Brand / product & what you're selling</label>
          <input
            className="pz-input"
            value={brand}
            onChange={(e) => setBrand(e.target.value)}
            placeholder="e.g. Lush Hair — premium human-hair wigs"
            disabled={loading}
          />
        </div>

        <div className="pz-two">
          <div className="pz-field">
            <label className="pz-label">
              Offer <span className="pz-opt">(or tap one above)</span>
            </label>
            <input
              className="pz-input"
              value={offer}
              onChange={(e) => setOffer(e.target.value)}
              placeholder="e.g. Buy 1 Get 1, 20% off"
              disabled={loading}
            />
          </div>
          <div className="pz-field">
            <label className="pz-label">Price</label>
            <input
              className="pz-input"
              value={price}
              onChange={(e) => setPrice(e.target.value)}
              placeholder="e.g. ₦25,000"
              disabled={loading}
            />
          </div>
        </div>

        <div className="pz-field">
          <label className="pz-label">
            Audience <span className="pz-opt">(optional)</span>
          </label>
          <input
            className="pz-input"
            value={audience}
            onChange={(e) => setAudience(e.target.value)}
            placeholder="e.g. young pros in Lagos"
            disabled={loading}
          />
        </div>

        <div className="pz-field">
          <label className="pz-label">
            Store notes / other info <span className="pz-opt">(address, guarantee, pay-on-delivery, hours…)</span>
          </label>
          <textarea
            className="pz-input pz-textarea"
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
            placeholder="Anything the copy should use — e.g. 'Shop 4, Balogun Market. 7-day money-back guarantee. Pay on delivery in Lagos.'"
            disabled={loading}
            rows={3}
          />
        </div>

        <div className="pz-field">
          <label className="pz-label">
            Add a screenshot{" "}
            <span className="pz-opt">(product photo, competitor ad, testimonial — lets the AI actually see it)</span>
          </label>
          <input
            type="file"
            accept="image/*"
            onChange={onPickRefImage}
            disabled={loading}
            className="pz-file"
          />
          {refImage && (
            <div className="pz-imgrow">
              <img src={refImage.preview} alt="reference" className="pz-thumb" />
              <button className="pz-ref-x" onClick={() => setRefImage(null)}>
                remove
              </button>
            </div>
          )}
          <textarea
            className="pz-input pz-textarea"
            style={{ marginTop: 10 }}
            value={additionalDetails}
            onChange={(e) => setAdditionalDetails(e.target.value)}
            placeholder="Additional details about the screenshot or the copy — e.g. 'This is our best-seller, focus on the color options' or 'This is a competitor ad, beat this angle'"
            disabled={loading}
            rows={2}
          />
        </div>

        <div className="pz-field">
          <label className="pz-label">Tone</label>
          <div className="pz-chips">
            {TONES.map((t) => (
              <button
                key={t}
                className={"pz-chip" + (tone === t ? " on" : "")}
                onClick={() => setTone(t)}
                disabled={loading}
              >
                {t}
              </button>
            ))}
          </div>
        </div>

        <div className="pz-row">
          <div className="pz-field pz-count">
            <label className="pz-label">How many</label>
            <div className="pz-chips">
              {[1, 3, 5].map((n) => (
                <button
                  key={n}
                  className={"pz-chip sm" + (count === n ? " on" : "")}
                  onClick={() => setCount(n)}
                  disabled={loading}
                >
                  {n}
                </button>
              ))}
            </div>
          </div>
        </div>

        <button className="pz-go" onClick={handleGenerate} disabled={loading}>
          {loading ? status || "Working…" : "Write copy"}
          {!loading && <span className="pz-bolt">{"\u270D"}</span>}
        </button>
      </section>

      {groundNote && <div className="pz-warn">{groundNote}</div>}
      {error && <div className="pz-error">{error}</div>}

      {items.length > 0 && (
        <div className="pz-results-top">
          <span className="pz-count-label">
            {items.length} version{items.length > 1 ? "s" : ""} ready
          </span>
          <button className="pz-copyall" onClick={copyAll}>
            {copiedAll ? "Copied all" : "Copy all"}
          </button>
        </div>
      )}

      <div className="pz-cards">
        {items.map((item, i) => (
          <CopyCard
            key={i}
            item={item}
            index={i}
            onCopy={() => copyOne(item)}
            onOptimize={optimizeItem}
            optimizing={optimizingIndex === i}
          />
        ))}
        {loading && (
          <div className="pz-loading">
            <div className="pz-slate" />
            <span>{status}</span>
          </div>
        )}
        {items.length === 0 && !loading && !error && (
          <div className="pz-empty">
            Analyse a niche to see who's winning and what offers work — then write copy modeled on it.
          </div>
        )}
      </div>
      </>
      )}

      {tab === "direct" && (
      <>
        <section className="pz-panel">
          <div className="pz-field">
            <label className="pz-label">Paste the script / copy to direct</label>
            <textarea
              className="pz-input pz-textarea"
              style={{ minHeight: 150 }}
              value={directScript}
              onChange={(e) => setDirectScript(e.target.value)}
              placeholder="Paste a generated (or any) script here…"
              disabled={directLoading}
              rows={7}
            />
          </div>
          <div className="pz-field">
            <label className="pz-label">
              Niche / industry{" "}
              <span className="pz-opt">(so it matches how winners in your space shoot)</span>
            </label>
            <input
              className="pz-input"
              value={directNiche}
              onChange={(e) => setDirectNiche(e.target.value)}
              placeholder={niche.trim() ? niche : "e.g. skincare, food brand"}
              disabled={directLoading}
            />
          </div>
          <button
            className="pz-go"
            onClick={generateDirective}
            disabled={directLoading || !directScript.trim()}
          >
            {directLoading ? directStatus || "Working…" : "Give creative directions"}
            {!directLoading && <span className="pz-bolt">{"\u{1F3AC}"}</span>}
          </button>
          <p className="pz-note">
            Grounds the direction in how winning brands in your niche actually shoot. Run “Analyse this niche” in the Write tab first for the tightest match.
          </p>
        </section>

        {directError && <div className="pz-error">{directError}</div>}

        <div className="pz-cards">
          {directive && (
            <CopyCard
              item={directive}
              index={0}
              onCopy={() => copyOne(directive)}
              showOptimize={false}
            />
          )}
          {directLoading && (
            <div className="pz-loading">
              <div className="pz-slate" />
              <span>{directStatus}</span>
            </div>
          )}
          {!directive && !directLoading && !directError && (
            <div className="pz-empty">
              Paste a script and get a shoot-ready creative directive — creative type, shot list, visual style, pacing — modeled on winning brands.
            </div>
          )}
        </div>
      </>
      )}
    </div>
  );
}

function CopyCard({ item, index, onCopy, onOptimize, optimizing, showOptimize = true }) {
  const [copied, setCopied] = useState(false);
  function copy() {
    onCopy();
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  }
  return (
    <article className="pz-card" style={{ animationDelay: `${index * 60}ms` }}>
      <div className="pz-slate-stripe" />
      <div className="pz-card-head">
        <span className="pz-num">{String(index + 1).padStart(2, "0")}</span>
        <span className="pz-pill">{TYPE_LABEL[item.type] || item.type}</span>
        {item.label && <span className="pz-pill plat">{item.label}</span>}
        <div className="pz-cardbtns">
          {showOptimize && (
            <button
              className="pz-opt-btn"
              onClick={() => onOptimize(index)}
              disabled={optimizing}
            >
              {optimizing ? "Optimizing…" : "Optimize (v5.6)"}
            </button>
          )}
          <button className="pz-copy" onClick={copy}>
            {copied ? "Copied" : "Copy"}
          </button>
        </div>
      </div>
      {(item.blocks || []).map((b, bi) => (
        <div className="pz-block" key={bi}>
          <div className="pz-block-tag">{b.label}</div>
          {Array.isArray(b.items) ? (
            <ol className="pz-list">
              {b.items.map((it, i) => (
                <li key={i}>
                  <span className="pz-list-n">{String(i + 1).padStart(2, "0")}</span>
                  <span>{renderRich(it)}</span>
                </li>
              ))}
            </ol>
          ) : (
            <p className="pz-text">{renderRich(b.text)}</p>
          )}
        </div>
      ))}
    </article>
  );
}
